name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Check Omarchy packaging
        run: npm run omarchy:check

      - name: Smoke-test Omarchy install lifecycle
        if: matrix.node == '24.14.0'
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          test_home="$test_root/home"
          test_data="$test_root/data"
          test_state="$test_root/state"
          test_install="$test_root/install/gods-eye-view"

          HOME="$test_home" \
            XDG_DATA_HOME="$test_data" \
            XDG_STATE_HOME="$test_state" \
            GEV_INSTALL_ROOT="$test_install" \
            npm run omarchy:install

          test -x "$test_home/.local/bin/gods-eye-view-launch"
          test -f "$test_data/applications/com.bilawal.GodsEyeView.desktop"
          test -f "$test_data/icons/hicolor/scalable/apps/com.bilawal.GodsEyeView.svg"
          test ! -e "$test_install/.env"

          HOME="$test_home" \
            XDG_DATA_HOME="$test_data" \
            XDG_STATE_HOME="$test_state" \
            GEV_INSTALL_ROOT="$test_install" \
            npm run omarchy:uninstall

          test ! -e "$test_install"
          test ! -e "$test_home/.local/bin/gods-eye-view-launch"

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs

      - name: Build production bundle
        run: npm run build
